name: Publish encrypted static record

on:
  push:
    branches: [main]
    paths:
      - site.bundle.enc
      - decrypt.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out encrypted source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate deployment secrets
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
          SITE_PATH: ${{ secrets.SITE_PATH }}
        run: |
          test -n "$SITE_KEY"
          test -n "$SITE_PATH"

      - name: Decrypt deployment bundle
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
        run: node decrypt.mjs decrypt site.bundle.enc /tmp/deployment.tar.gz

      - name: Assemble unlisted site
        env:
          SITE_PATH: ${{ secrets.SITE_PATH }}
        run: |
          mkdir -p /tmp/harbor-pages _site
          tar -xzf /tmp/deployment.tar.gz -C /tmp/harbor-pages
          cp -a /tmp/harbor-pages/root/. _site/
          mkdir -p "_site/$SITE_PATH"
          cp -a /tmp/harbor-pages/site/. "_site/$SITE_PATH/"
          test -f _site/index.html
          test -f _site/robots.txt
          test ! -f "_site/$SITE_PATH/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup-artifact:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: ${{ always() && needs.deploy.result == 'success' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Remove decrypted Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids="$(
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            | jq --raw-output '.artifacts[] | select(.name == "github-pages") | .id'
          )"
          for artifact_id in $artifact_ids; do
            curl --fail --silent --show-error --location \
              --request DELETE \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
