name: Publish encrypted static record

on:
  push:
    branches: [main]
    paths:
      - site.bundle.enc
      - player.bundle.enc
      - decrypt.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out encrypted source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate deployment secrets
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
          SITE_PATH: ${{ secrets.SITE_PATH }}
          PLAYER_SITE_KEY: ${{ secrets.PLAYER_SITE_KEY }}
          PLAYER_SITE_PATH: ${{ secrets.PLAYER_SITE_PATH }}
        run: |
          set -euo pipefail
          test -n "$SITE_KEY"
          test -n "$SITE_PATH"
          test -n "$PLAYER_SITE_KEY"
          test -n "$PLAYER_SITE_PATH"
          test "${#SITE_KEY}" -ge 48
          test "${#PLAYER_SITE_KEY}" -ge 48
          [[ "$SITE_PATH" =~ ^[a-z0-9-]{24,80}$ ]]
          [[ "$PLAYER_SITE_PATH" =~ ^guide-[a-f0-9]{40}$ ]]
          test "$SITE_PATH" != "$PLAYER_SITE_PATH"

      - name: Decrypt design wiki bundle
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
        run: node decrypt.mjs decrypt site.bundle.enc /tmp/design-deployment.tar.gz

      - name: Decrypt player wiki bundle
        env:
          SITE_KEY: ${{ secrets.PLAYER_SITE_KEY }}
        run: node decrypt.mjs decrypt player.bundle.enc /tmp/player-deployment.tar.gz

      - name: Validate encrypted package boundaries
        run: |
          set -euo pipefail
          validate_archive() {
            local archive="$1"
            local listing
            listing="$(mktemp)"
            tar -tzf "$archive" > "$listing"
            if grep -Eq '(^/|(^|/)\.\.(/|$))' "$listing"; then
              rm -f "$listing"
              return 1
            fi
            rm -f "$listing"
          }
          validate_archive /tmp/design-deployment.tar.gz
          validate_archive /tmp/player-deployment.tar.gz

      - name: Assemble both unlisted sites
        env:
          SITE_PATH: ${{ secrets.SITE_PATH }}
          PLAYER_SITE_PATH: ${{ secrets.PLAYER_SITE_PATH }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/design-pages /tmp/player-pages
          tar -xzf /tmp/design-deployment.tar.gz -C /tmp/design-pages
          tar -xzf /tmp/player-deployment.tar.gz -C /tmp/player-pages
          if find /tmp/design-pages /tmp/player-pages -type l -print -quit | grep -q .; then
            exit 1
          fi
          if find /tmp/design-pages /tmp/player-pages -type f -links +1 -print -quit | grep -q .; then
            exit 1
          fi
          test -d /tmp/design-pages/root
          test -d /tmp/design-pages/site
          test -d /tmp/player-pages/site
          test ! -e /tmp/player-pages/root
          test "$(find /tmp/player-pages/site -type f | wc -l)" -eq 1
          test "$(find /tmp/player-pages/site -type f -name '*.html' | wc -l)" -eq 1
          test ! -f /tmp/player-pages/site/index.html

          rm -rf _site
          mkdir -p _site
          cp -a /tmp/design-pages/root/. _site/
          mkdir -p "_site/$SITE_PATH"
          cp -a /tmp/design-pages/site/. "_site/$SITE_PATH/"
          mkdir -p "_site/$PLAYER_SITE_PATH"
          cp -a /tmp/player-pages/site/. "_site/$PLAYER_SITE_PATH/"

          test -f _site/index.html
          test -f _site/robots.txt
          grep -Fqx 'User-agent: *' _site/robots.txt
          grep -Fqx 'Disallow: /' _site/robots.txt
          grep -Fq 'noindex, nofollow, noarchive, nosnippet, noimageindex' _site/index.html
          grep -Fq 'name="referrer" content="no-referrer"' _site/index.html
          test ! -f "_site/$SITE_PATH/index.html"
          test ! -f "_site/$PLAYER_SITE_PATH/index.html"
          test "$(find "_site/$PLAYER_SITE_PATH" -type f -name '*.html' | wc -l)" -eq 1
          while IFS= read -r -d '' page; do
            grep -Fq 'noindex, nofollow, noarchive, nosnippet, noimageindex' "$page"
            grep -Fq 'name="referrer" content="no-referrer"' "$page"
          done < <(find "_site/$SITE_PATH" "_site/$PLAYER_SITE_PATH" -type f -name '*.html' -print0)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup-artifact:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: ${{ always() }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Remove decrypted Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids="$(
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            | jq --raw-output '.artifacts[] | select(.name == "github-pages") | .id'
          )"
          for artifact_id in $artifact_ids; do
            curl --fail --silent --show-error --location \
              --request DELETE \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
